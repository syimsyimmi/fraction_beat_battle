<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Beat Battle</title>
<style>
:root{font-family:Trebuchet MS,Arial,sans-serif;color:#f8f5e9;background:#111b2d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#3b4863,#111b2d 70%)}button,input{font:inherit}button{cursor:pointer;border:2px solid #f4d184;border-radius:14px;background:linear-gradient(#ffe4a1,#d99a41);color:#292038;padding:11px 20px;font-weight:900;box-shadow:0 4px 0 #78502c}button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#334660;color:white;border-color:#8093b4;box-shadow:0 3px 0 #182638}.wrap{max-width:1100px;margin:auto;padding:12px}.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#101b2bcc;border:1px solid #8a7790;border-radius:15px;padding:10px 16px}.hud strong{color:#ffe19a}.screen{position:relative;overflow:hidden;min-height:590px;margin-top:12px;border:4px solid #bba377;border-radius:20px;background:linear-gradient(#465c75 0 46%,#293d4d 46% 48%,#6d5a49 48%);box-shadow:0 14px 45px #0008}.school{position:absolute;inset:0;pointer-events:none;opacity:.8}.window{position:absolute;top:9%;width:15%;height:31%;border:10px solid #413d44;background:linear-gradient(140deg,#c5a979,#6b8999 60%,#d9b981);box-shadow:inset 0 0 0 3px #c9bca6,0 5px 15px #0005}.window:after{content:"";position:absolute;left:45%;height:100%;width:7px;background:#423d43}.w1{left:5%}.w2{right:5%}.board{position:absolute;top:6%;left:27%;width:46%;height:37%;background:#253e3c;border:12px solid #8a6a4c;box-shadow:0 8px 14px #0005}.floor{position:absolute;bottom:0;width:100%;height:42%;background:repeating-linear-gradient(165deg,#67503f 0 45px,#82674d 47px 51px,#4e3d33 54px 56px)}.decor{position:absolute;bottom:9%;left:3%;font-size:68px;opacity:.65}.decor2{position:absolute;bottom:8%;right:3%;font-size:68px;opacity:.65}.content{position:relative;z-index:1;padding:22px;min-height:590px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center}.panel{background:#111c31eF;border:2px solid #d2b577;border-radius:20px;padding:20px;max-width:850px;width:100%;box-shadow:0 9px 25px #0008}.panel h1{font-size:clamp(30px,5vw,58px);margin:8px 0;color:#ffe5a4;text-shadow:3px 4px #5a344c}.panel h2{font-size:clamp(22px,3vw,34px);margin:8px;color:#ffe4a4}.subtitle{color:#d9e6f6}.question{font-size:clamp(22px,3vw,32px);font-weight:bold;line-height:1.5}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .13em;font-weight:800;font-variant-numeric:tabular-nums}.frac .top{border-bottom:2.5px solid currentColor;padding:0 .14em .1em}.frac .bottom{padding:.1em .14em 0}.mixed{display:inline-flex;align-items:center;white-space:nowrap}.mixed .whole{margin-right:.04em}.missionbar{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#101b2de8;border:1px solid #f1c77e;border-radius:14px;padding:10px 14px}.missionbar .smallq{font-size:22px}.strips{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%;margin:22px 0 12px}.strip{display:grid;grid-template-columns:repeat(4,1fr);width:min(330px,43%);height:78px;border:4px solid #f8d38b;border-radius:9px;overflow:hidden;background:#f7edcf}.cell{position:relative;border-right:2px solid #6d5670;background:#f3e5c4;display:grid;place-items:center;font-size:30px;color:#52336b;cursor:crosshair;user-select:none;transition:background .15s}.cell:last-child{border-right:0}.cell.filled{background:linear-gradient(135deg,#ffe18a,#ff9fbe);color:#5e2776}.cell:focus-visible{outline:4px solid #fff;outline-offset:-4px}.launch{font-size:58px;filter:drop-shadow(0 5px 4px #0008)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.feedback{min-height:30px;font-weight:bold;color:#ffe3a0}.answers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:15px}.answers button{min-width:130px;font-size:25px}.num{width:85px;text-align:center;font-size:30px;border:3px solid #e7c27a;border-radius:10px;padding:8px;background:#fff5d8;color:#212333}.numrow{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;align-items:center}.progress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.dot{font-size:26px;filter:grayscale(1);opacity:.5}.dot.done{filter:none;opacity:1}.noteFly{position:fixed;z-index:99;pointer-events:none;font-size:33px;color:#ffe08b;animation:fly .27s ease-out forwards}@keyframes fly{from{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.7}to{transform:translate(0,0) scale(1);opacity:1}}.spark{animation:pop .45s}@keyframes pop{50%{transform:scale(1.06);filter:brightness(1.3)}}.hint{color:#c5d6e7;font-size:15px}.foot{color:#b6c5d6;font-size:13px;text-align:center;padding:12px}@media(max-width:650px){.screen,.content{min-height:640px}.content{padding:12px}.strip{width:95%;height:56px}.cell{font-size:25px}.panel{padding:14px}.hud{font-size:13px}.missionbar .smallq{font-size:18px}.answers button{min-width:90px;font-size:20px}.decor,.decor2{font-size:38px}}
</style></head><body><div class="wrap"><header class="hud"><span id="lives">❤️❤️❤️</span><span>⭐ Score: <strong id="score">0</strong></span><span>🎵 <strong id="notes">0/5</strong></span><button class="secondary" id="soundBtn" onclick="toggleSound()">🔊 Sound On</button><button class="secondary" onclick="home()">⌂ Home</button></header><main class="screen" id="screen"><div class="school"><div class="floor"></div><div class="board"></div><div class="window w1"></div><div class="window w2"></div><div class="decor" id="decor">🎹</div><div class="decor2" id="decor2">🎸</div></div><div class="content" id="content"></div></main><div class="foot">Year 4 Mathematics • Five missions • Original looping background music • Click or tap cells to shoot musical notes • Offline HTML5 game</div></div>
<script>
const missions=[
{room:'The Forgotten Classroom',icon:'🏫',q:['fraction',5,4],prompt:'Represent this improper fraction using rhythm strips.',answer:['mixed',1,1,4],type:'mc',choices:[['mixed',1,1,4],['mixed',1,2,4],['mixed',2,1,4]],correct:0,count:5,strips:2,decor:['🎼','🪑'],tip:'Four quarters make one whole.'},
{room:'The Secret Library',icon:'📚',q:['fraction',7,4],prompt:'Convert this improper fraction into a mixed number.',answer:['mixed',1,3,4],type:'fields',count:7,strips:2,decor:['📚','🕯️'],tip:'Count the full strips and the remaining quarters.'},
{room:'The Rhythm Laboratory',icon:'🔬',q:['mixed',2,1,4],prompt:'Represent this mixed number using rhythm strips.',answer:['fraction',9,4],type:'mc',choices:[['fraction',7,4],['fraction',9,4],['fraction',10,4]],correct:1,count:9,strips:3,decor:['⚗️','🎻'],tip:'Multiply the whole number by four, then add one.'},
{room:'The Abandoned Music Hall',icon:'🎸',q:['fraction',11,4],prompt:'Convert this improper fraction into a mixed number.',answer:['mixed',2,3,4],type:'mc',choices:[['mixed',2,1,4],['mixed',2,3,4],['mixed',3,1,4]],correct:1,count:11,strips:3,decor:['🎹','🎸'],tip:'Eleven quarters contain two complete wholes.'},
{room:'The Rooftop Exit',icon:'🌟',q:['mixed',3,2,4],prompt:'Convert this mixed number into an improper fraction.',answer:['fraction',14,4],type:'numerator',count:14,strips:4,decor:['🌙','🚪'],tip:'Three groups of four quarters, plus two more quarters.'}
];
let level=0,stage='home',lives=3,score=0,completed=0,filled=[],modelAward=false,answerTries=0,sound=true,ctx=null,locked=false;
const el=id=>document.getElementById(id);
function frac(n,d){return `<span class="frac" aria-label="${n} over ${d}"><span class="top">${n}</span><span class="bottom">${d}</span></span>`}
function math(v){return v[0]==='fraction'?frac(v[1],v[2]):`<span class="mixed"><span class="whole">${v[1]}</span>${frac(v[2],v[3])}</span>`}
function tone(freq=440,dur=.12,type='sine'){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}
let musicTimer=null,musicStep=0,duckUntil=0;
// Original looping arcade-style melody, synthesized locally without external assets.
const melody=[659,784,880,784,659,587,523,587,659,659,784,988,880,784,659,587,523,587,659,523,440,523,587,659,784,659,587,523,392,523,587,0];
function synth(freq,dur=.16,type='square',volume=.017){if(!sound||!freq)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}
function startMusic(){if(musicTimer!==null||!sound)return;musicTimer=setInterval(()=>{if(!sound||Date.now()<duckUntil)return;let f=melody[musicStep%melody.length];if(f)synth(f,.17,'square',.014);if(musicStep%4===0)synth(130.81,.24,'triangle',.012);if(musicStep%4===2)synth(196,.09,'square',.006);musicStep++},210)}
function stopMusic(){if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null}}
function fanfare(final=false){if(!sound)return;duckUntil=Date.now()+(final?2400:1650);const notes=final?[[523,0,180],[659,190,180],[784,380,180],[1047,590,320],[784,960,140],[1047,1120,520]]:[[523,0,135],[659,160,135],[784,320,160],[1047,520,430]];notes.forEach(([f,delay,dur])=>setTimeout(()=>synth(f,dur/1000,'triangle',.085),delay));}
function winSound(){fanfare(false)}
function toggleSound(){sound=!sound;el('soundBtn').textContent=sound?'🔊 Sound On':'🔇 Sound Off';if(sound){tone();if(stage!=='home')startMusic()}else stopMusic()}
function hud(){el('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);el('score').textContent=score;el('notes').textContent=completed+'/5'}
function roomStyle(){let m=missions[level];el('decor').textContent=m.decor[0];el('decor2').textContent=m.decor[1];el('screen').style.background=['linear-gradient(#5b667d 0 48%,#584c48 48%)','linear-gradient(#38475d 0 48%,#4d413a 48%)','linear-gradient(#3d6170 0 48%,#4e5452 48%)','linear-gradient(#674f69 0 48%,#55444a 48%)','linear-gradient(#6b6285 0 48%,#46576a 48%)'][level]}
function render(html){el('content').innerHTML=html;hud()}
function home(){stopMusic();stage='home';level=0;lives=3;score=0;completed=0;roomStyle();render(`<div class="panel"><div style="font-size:65px">🎸 🎵 🏫</div><h1>FRACTION BEAT BATTLE</h1><h2>The Mystery of the Forgotten Music School</h2><p class="subtitle">Restore the Rhythm. Solve the Fractions. Escape the School!</p><p>Five Golden Music Notes have disappeared. Explore five mysterious rooms, solve fraction challenges and unlock the school exit!</p><p>❤️ Three lives &nbsp; ⭐ Earn points &nbsp; 🎵 Collect 5 notes</p><p class="hint">Original 8-bit background music starts when you begin. Each completed mission plays a victory fanfare!</p><button onclick="startLevel()">▶ START ADVENTURE</button></div>`)}
function startLevel(){startMusic();stage='intro';filled=[];modelAward=false;answerTries=0;locked=false;roomStyle();let m=missions[level];render(`<div class="panel"><div style="font-size:56px">${m.icon}</div><p>MISSION ${level+1} OF 5</p><h2>${m.room}</h2><div class="question">${m.prompt}<div style="margin:16px">${math(m.q)}</div></div><p class="hint">Shoot musical notes to build the correct fraction model.</p><button onclick="startShooting()">🎯 START MISSION</button></div>`);tone(392,.15)}
function bar(){let m=missions[level];return `<div class="missionbar"><span>MISSION ${level+1} • ${m.room}</span><span class="smallq">${math(m.q)}</span><span>🎵 <b id="count">0</b> placed</span></div>`}
function startShooting(){stage='shoot';filled=Array(missions[level].strips*4).fill(false);drawShoot()}
function drawShoot(msg=''){let m=missions[level];render(`${bar()}<div class="panel" style="max-width:950px"><h2>🎯 SHOOT THE MUSIC NOTES!</h2><p>Click or tap any empty quarter to shoot. Tap a filled quarter to remove its note.</p><div class="strips">${Array.from({length:m.strips},(_,s)=>`<div class="strip" aria-label="Rhythm strip ${s+1}">${Array.from({length:4},(_,j)=>{let i=s*4+j;return `<div role="button" tabindex="0" aria-label="Strip ${s+1}, quarter ${j+1}" class="cell ${filled[i]?'filled':''}" data-i="${i}" onclick="shoot(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();shoot(${i})}">${filled[i]?'♫':''}</div>`}).join('')}</div>`).join('')}</div><div class="launch">🎸 ✨ 🎵</div><p class="feedback" id="feedback">${msg||'Build the fraction model, then check your work!'}</p><div class="actions"><button onclick="checkModel()">✓ CHECK MODEL</button><button class="secondary" onclick="clearNotes()">↺ CLEAR NOTES</button></div></div>`);el('count').textContent=filled.filter(Boolean).length}
function shoot(i){if(stage!=='shoot')return;filled[i]=!filled[i];let target=document.querySelector(`[data-i="${i}"]`);if(filled[i]){tone(330+(i%4)*85,.12,'triangle');let r=target.getBoundingClientRect(),fly=document.createElement('div');fly.className='noteFly';fly.textContent='♪';fly.style.left=r.left+r.width/2+'px';fly.style.top=r.top+r.height/2+'px';fly.style.setProperty('--dx','-45px');fly.style.setProperty('--dy','90px');document.body.appendChild(fly);setTimeout(()=>fly.remove(),320)}else tone(220,.08);target.classList.toggle('filled',filled[i]);target.textContent=filled[i]?'♫':'';el('count').textContent=filled.filter(Boolean).length;el('feedback').textContent=''}
function clearNotes(){filled.fill(false);drawShoot('Notes cleared. Try another arrangement!')}
function checkModel(){let m=missions[level],counts=Array.from({length:m.strips},(_,s)=>filled.slice(s*4,s*4+4).filter(Boolean).length).sort((a,b)=>b-a),full=Math.floor(m.count/4),remain=m.count%4,expected=Array(m.strips).fill(0).map((_,i)=>i<full?4:i===full?remain:0).sort((a,b)=>b-a);if(counts.every((v,i)=>v===expected[i])){if(!modelAward){score+=50;modelAward=true}tone(523,.13);setTimeout(()=>tone(659,.2),100);stage='answer';drawAnswer()}else{el('feedback').textContent=filled.filter(Boolean).length!==m.count?`You have placed ${filled.filter(Boolean).length} notes. Check how many quarters you need!`:'Count the complete wholes. Rearrange the notes to make full strips!';tone(180,.2)}hud()}
function drawAnswer(message=''){let m=missions[level],controls='';if(m.type==='mc')controls=`<div class="answers">${m.choices.map((v,i)=>`<button onclick="checkAnswer(${i})">${'ABC'[i]}. ${math(v)}</button>`).join('')}</div>`;if(m.type==='fields')controls=`<div class="numrow"><label class="field">Whole number<input class="num" id="whole" type="number" min="0" max="9" inputmode="numeric"></label><label class="field">Remaining quarters<input class="num" id="remainder" type="number" min="0" max="3" inputmode="numeric"></label></div><div class="actions" style="margin-top:18px"><button onclick="checkAnswer()">✓ CHECK ANSWER</button></div>`;if(m.type==='numerator')controls=`<div class="numrow"><label class="field">Numerator<input class="num" id="numerator" type="number" min="0" max="99" inputmode="numeric"></label><label class="field">Denominator<input class="num" id="denominator" type="number" min="1" max="99" inputmode="numeric"></label></div><div class="actions" style="margin-top:18px"><button onclick="checkAnswer()">✓ CHECK ANSWER</button></div>`;render(`${bar()}<div class="panel"><div style="font-size:44px">✨🎵✨</div><h2>MODEL COMPLETE! +50 ⭐</h2><div class="question">Now convert: ${math(m.q)} = ?</div>${controls}<p class="feedback">${message}</p><p class="hint">Tip: ${m.tip}</p></div>`);el('count').textContent=m.count}
function checkAnswer(choice){if(stage!=='answer'||locked)return;let m=missions[level],ok=m.type==='mc'?choice===m.correct:m.type==='fields'?Number(el('whole').value)===1&&Number(el('remainder').value)===3&&el('whole').value!==''&&el('remainder').value!=='':Number(el('numerator').value)===14&&Number(el('denominator').value)===4&&el('numerator').value!==''&&el('denominator').value!=='';if(ok){locked=true;score+=answerTries===0?50:25;if(level===3&&answerTries===0)score+=10;completed=Math.max(completed,level+1);stage='success';winSound();drawSuccess()}else{answerTries++;lives--;tone(175,.25);hud();if(lives<=0){stage='out';render(`<div class="panel"><h1>OUT OF LIVES!</h1><p>Don't give up! Try this room again.</p><button onclick="retry()">↺ TRY AGAIN</button></div>`)}else drawAnswer(`Not quite! ${m.tip} One life lost. Try again!`)}}
function retry(){lives=3;startLevel()}
function drawSuccess(){let m=missions[level];let expl=level===2?`<p>(${2} × 4) + 1 = 9</p>`:level===4?`<p>(3 × 4) + 2 = 14</p>`:'';render(`<div class="panel spark"><div style="font-size:70px">🏆 🎵</div><h1 style="font-size:38px">MISSION COMPLETED!</h1><div class="question">${math(m.q)} = ${math(m.answer)}</div>${expl}<p>⭐ Score: ${score} &nbsp; 🎵 Golden Notes: ${completed}/5</p><div class="progress">${missions.map((_,i)=>`<span class="dot ${i<completed?'done':''}">🎵</span>`).join('')}</div><br><button onclick="nextRoom()">${level===4?'🏆 SEE FINAL VICTORY':'🚪 NEXT ROOM →'}</button></div>`)}
function nextRoom(){if(stage!=='success')return;if(level===4){stage='victory';fanfare(true);render(`<div class="panel"><div style="font-size:80px">🎵✨🎸✨🎵</div><h1>CONGRATULATIONS!</h1><h2>YOU ARE THE FRACTION BEAT MASTER!</h2><p>The five Golden Music Notes have restored the rhythm. The rooftop door is open!</p><h2>⭐ FINAL SCORE: ${score}</h2><p>🎵 Golden Notes: 5/5 &nbsp; 🏆 Missions: 5/5</p><button onclick="home()">↺ PLAY AGAIN</button> <button class="secondary" onclick="home()">⌂ BACK TO HOME</button></div>`)}else{level++;startLevel()}}
home();
</script></body></html>
